# LLM configuration. Filled in P0 Step 0.6 after the model probes.
# Every entry needs a verified training cutoff with its official source URL.
#
# Template:
#   primary:
#     provider: openai_compatible        # openai_compatible | anthropic | openai | google
#     model_id: "<provider model id>"
#     base_url: "<endpoint>"             # for openai_compatible
#     api_key_env: PRIMARY_API_KEY
#     training_cutoff: 2024-08-01
#     cutoff_source: "https://..."
#     reasoning: false
#     temperature: 0.3
#     max_output_tokens: 4096
#     max_concurrency: 4
#     price_in_per_mtok: 0.0             # USD per 1M input tokens
#     price_out_per_mtok: 0.0
#     context_window: 128000
#     structured_output: false
models:
  # D0.1 (2026-10-05, user decision): an older model whose cutoff precedes T_post.
  # gemini-2.5-flash is closed to new users; gemini-2.5-flash-lite is the oldest available
  # GA model on this key. Probe: 5/5 schema-valid (docs/model_selection_memo.md).
  primary:
    provider: openai_compatible
    model_id: gemini-2.5-flash-lite
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GOOGLE_API_KEY
    training_cutoff: 2025-01-01
    cutoff_source: https://docs.cloud.google.com/vertex-ai/generative-ai/docs/models/gemini/2-5-flash-lite
    reasoning: false                    # thinking off by default; probe showed no thinking tokens
    temperature: 0.3
    max_output_tokens: 8192
    max_concurrency: 4
    price_in_per_mtok: 0.10             # verify on ai.google.dev pricing page
    price_out_per_mtok: 0.40
    context_window: 1048576
    structured_output: false
