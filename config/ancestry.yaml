# Subtotal hierarchy (P2 §5.3). Each line's own `parent` is set per package by the builder;
# this map says where each subtotal rolls up. A change to a line must be applied to its
# parent and to every ancestor listed here (P3 apply_delta).
BS:
  current_assets: total_assets
  non_current_assets: total_assets
  current_liabilities: total_liabilities
  non_current_liabilities: total_liabilities
  total_liabilities: total_liabilities_and_equity
  equity_owners: total_equity
  non_controlling_interest: total_equity
  total_equity: total_liabilities_and_equity
CF:
  cfo: net_change_in_cash
  cfi: net_change_in_cash
  cff: net_change_in_cash
  fx_effect_on_cash: net_change_in_cash
  net_change_in_cash: ending_cash
