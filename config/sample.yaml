# Sample definition (research plan §6.2, §6.3; decisions D1, D8, D2.5).

# D1 (docs/model_selection_memo.md): both primary candidates (Llama 4 Scout, Gemma 3 27B)
# have an August 2024 training cutoff. Rule: t_post >= cutoff + 3 months; prefer FY2025.
t_post: 2026-04-01
# Optional pre-cutoff replication only (D7.4).
t_pre: 2023-04-03

groups:
  L:
    size: 50
    market: KOSPI
    description: Top KOSPI firms by market cap after exclusions
  M:
    size: 50
    market: KOSPI
    description: KOSPI market-cap ranks 101-400, quintile x newsworthiness stratified (D8, D2.5)
  S:
    size: 50
    market: KOSDAQ
    description: KOSDAQ firms with an outstanding, in-the-money convertible bond

mid_rank_band: [101, 400]

exclusions:
  # KSIC divisions 64-66: financial services, insurance, auxiliary financial activities
  ksic_prefixes: ["64", "65", "66"]
  admin_issue: true
  trading_halt: true
  capital_impairment: true
  min_years: 3

cb_search_years: 6   # D1.2
seed: 20261019
