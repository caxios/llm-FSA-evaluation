[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-fsa-evaluation"
version = "0.1.0"
description = "Do LLM valuation agents compute from filings or recall from memory? Metamorphic tests on Korean listed firms."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pydantic>=2.6",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "statsmodels>=0.14",
    "scipy>=1.12",
    "pykrx>=1.0.45",
    "yfinance>=0.2.40",
    "lxml>=5",
    "beautifulsoup4>=4.12",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "hypothesis>=6.100",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
